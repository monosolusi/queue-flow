# Per-service static host for a frontend PWA. The gateway reverse-proxies the
# service's sub-path here and strips the prefix (proxy_pass with a trailing
# slash), so this server serves the built bundle at root with an SPA fallback
# for client-side routes. Asset URLs in index.html already carry the base
# prefix (e.g. /kiosk/assets/...) and the gateway preserves those by routing
# the matching location back here. Gzip + long cache for hashed assets.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed bundle assets — immutable, long cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker + manifest — never cached (must update on deploys).
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location ~* \.webmanifest$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA fallback — every unknown path returns the app shell (client router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}