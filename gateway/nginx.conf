# Gateway — the single entry point for the on-premise LAN (NFR-SEC-01).
# Terminates HTTP on :80 and reverse-proxies every route to the right container:
#   /api/ + /ws   -> core-api-service:3000   (REST + WebSocket)
#   /kiosk/      -> kiosk-service:80          (visitor touchscreen PWA)
#   /tv/         -> tv-display-service:80     (TV queue board PWA)
#   /caller/     -> caller-service:80         (counter staff PWA)
#   /admin/      -> admin-service:80          (manager panel + first-run wizard)
#   /            -> 301 /admin/               (clean browser lands on the wizard)
#
# Access guard (license + first-run): while the store is unlicensed OR
# `isInitialSetupCompleted == false`, the gateway redirects operational access
# to the page that can fix it. nginx cannot read the DB, so each operational PWA
# route (`/kiosk/`, `/tv/`, `/caller/`) runs an `auth_request` subrequest to
# core-api's `GET /api/system/access-check` (200 = allowed, 403 = not).
#
# nginx permits only ONE `auth_request` per location, so the two gates are not
# chained — `access-check` answers both, license first, and returns the reason
# in an `X-QMS-Gate` header. `auth_request_set` lifts that header into
# `$gate_reason`, and the `map` below turns it into a redirect target:
# LICENSE_REQUIRED -> /admin/aktivasi, SETUP_REQUIRED -> /admin/wizard.
# `GET /api/system/setup-status` is left untouched — the admin SPA and the
# tier-2 topology check already depend on its contract. Exempt routes — `/admin/` (wizard SPA host), `/wizard`,
# `/api/` (the wizard must be able to PUT config + read setup-status), `/ws`,
# and `/` — never run the guard, so the wizard itself can load and complete
# setup. The admin SPA's client-side `SetupGuard` stays as a progressive-
# enhancement fallback for `/admin/`; the gateway guard covers the operational
# routes the SPA guard cannot reach.
# All assets are local (NFR-REL-01) — no upstream beyond the compose network.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Trust the compose network only; keep per-service defaults small.
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  # Compress text assets served to the LAN clients.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;
  # Allow large multipart/config uploads if ever needed; small by default.
  client_max_body_size 8m;

  # Reason -> page. `default` covers a gate that answered 403 without the
  # header (an older core-api, or a proxy that stripped it): sending those to
  # the wizard preserves the pre-license behaviour rather than dead-ending.
  map $gate_reason $gate_target {
    default            /admin/wizard;
    "LICENSE_REQUIRED" /admin/aktivasi;
    "SETUP_REQUIRED"   /admin/wizard;
  }

  # WebSocket + REST upstreams to core-api. The non-buffered + upgraded headers
  # make /ws a realtime channel (NFR-PERF-02, < 150 ms caller->TV on LAN).
  upstream core_api {
    server core-api-service:3000;
    keepalive 32;
  }

  # Announcement audio synthesis for the TV board.
  upstream tts_service {
    server tts-service:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name antrian.local _;

    # --- API + WebSocket -> core-api ---------------------------------------
    # /ws upgrade: hand the connection to core-api with Upgrade/Connection so
    # the native WS server (QUE-12) drives realtime broadcasts.
    location /ws {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
    }

    location /api/ {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Don't buffer SSE/streaming responses.
      proxy_buffering off;
    }

    # --- Announcement audio -> tts-service ---------------------------------
    # EXEMPT from the first-run guard below, exactly like /api/ and /ws:
    #   1. a 302 to the wizard HTML is a broken response for an <audio> consumer
    #      — the browser would try to decode markup and fire `error`;
    #   2. an auth_request on every announcement adds a core-api round trip
    #      inside the NFR-PERF-02 budget, and the guard's own design note below
    #      already argues against per-asset subrequests;
    #   3. it is unreachable pre-setup anyway — the /tv/ document route IS
    #      guarded, so no TV client exists yet to ask for audio.
    #
    # No trailing slash on proxy_pass: the /tts prefix is preserved and matched
    # by FastAPI's own router prefix. This is the same contract core-api uses
    # (`@Controller('api/health')`), and it is what lets the Vite dev proxy work
    # with no `rewrite` — strip the prefix here and dev/production diverge.
    location /tts/ {
      proxy_pass http://tts_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Start streaming the clip as it is produced rather than buffering it all.
      proxy_buffering off;
      # A cold synthesis is ~0.3 s, but loading the voice on the very first
      # request after a restart is slower; 120s is generous headroom over the
      # 60s default so a cold start never surfaces as a 504.
      proxy_read_timeout 120s;
    }

    # --- Frontend PWAs -----------------------------------------------------
    # Each location proxy_passes with a trailing slash, which strips the
    # matched prefix — the per-service nginx serves its bundle at root.

    # Access guard subrequest. `internal` so it is never served directly; the
    # operational locations below dispatch to it via `auth_request`. core-api
    # answers 200 (allowed) or 403 (license or setup missing). The body is
    # discarded — nginx `auth_request` inspects only the status and headers,
    # which is why access-check answers with @Res and puts the reason in a
    # header rather than throwing an HttpException with a JSON body.
    location = /__gate_check {
      internal;
      proxy_pass http://core_api/api/system/access-check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
    }

    # auth_request deny path: send the client to whichever page can resolve the
    # reason the gate gave.
    location @gate_redirect {
      return 302 $gate_target;
    }

    # Clean browser -> wizard. /admin/ serves the SPA; its client-side
    # SetupGuard redirects to /admin/wizard when unset (progressive enhancement;
    # the gateway guard below covers /kiosk, /tv, /caller).
    location = / {
      return 301 /admin/;
    }
    location = /wizard {
      return 301 /admin/wizard;
    }

    # Access guard scope: the `auth_request` runs on the
    # DOCUMENT request only (`location = /kiosk/` etc.), not on every asset. An
    # unconfigured client is redirected before its HTML loads, so it never
    # fetches assets; once setup is complete the document loads and assets
    # stream unguarded (no per-asset subrequest in the common steady state).
    location = /kiosk/ {
      auth_request /__gate_check;
      auth_request_set $gate_reason $upstream_http_x_qms_gate;
      error_page 401 403 = @gate_redirect;
      proxy_pass http://kiosk-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /kiosk/ {
      proxy_pass http://kiosk-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /kiosk {
      return 301 /kiosk/;
    }

    location = /tv/ {
      auth_request /__gate_check;
      auth_request_set $gate_reason $upstream_http_x_qms_gate;
      error_page 401 403 = @gate_redirect;
      proxy_pass http://tv-display-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /tv/ {
      proxy_pass http://tv-display-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /tv {
      return 301 /tv/;
    }

    location = /caller/ {
      auth_request /__gate_check;
      auth_request_set $gate_reason $upstream_http_x_qms_gate;
      error_page 401 403 = @gate_redirect;
      proxy_pass http://caller-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /caller/ {
      proxy_pass http://caller-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /caller {
      return 301 /caller/;
    }

    location /admin/ {
      proxy_pass http://admin-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /admin {
      return 301 /admin/;
    }
  }
}