# Gateway — the single entry point for the on-premise LAN (NFR-SEC-01).
# Terminates HTTP on :80 and reverse-proxies every route to the right container:
#   /api/ + /ws   -> core-api-service:3000   (REST + WebSocket)
#   /kiosk/      -> kiosk-service:80          (visitor touchscreen PWA)
#   /tv/         -> tv-display-service:80     (TV queue board PWA)
#   /caller/     -> caller-service:80         (counter staff PWA)
#   /admin/      -> admin-service:80          (manager panel + first-run wizard)
#   /            -> 301 /admin/               (clean browser lands on the wizard)
# All assets are local (NFR-REL-01) — no upstream beyond the compose network.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Trust the compose network only; keep per-service defaults small.
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  # Compress text assets served to the LAN clients.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;
  # Allow large multipart/config uploads if ever needed; small by default.
  client_max_body_size 8m;

  # WebSocket + REST upstreams to core-api. The non-buffered + upgraded headers
  # make /ws a realtime channel (NFR-PERF-02, < 150 ms caller->TV on LAN).
  upstream core_api {
    server core-api-service:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name antrian.local _;

    # --- API + WebSocket -> core-api ---------------------------------------
    # /ws upgrade: hand the connection to core-api with Upgrade/Connection so
    # the native WS server (QUE-12) drives realtime broadcasts.
    location /ws {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
    }

    location /api/ {
      proxy_pass http://core_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Don't buffer SSE/streaming responses.
      proxy_buffering off;
    }

    # --- Frontend PWAs -----------------------------------------------------
    # Each location proxy_passes with a trailing slash, which strips the
    # matched prefix — the per-service nginx serves its bundle at root.

    # Clean browser -> wizard. /admin/ serves the SPA; its SetupGuard fetches
    # /api/system/config and client-redirects to /admin/wizard when unset.
    location = / {
      return 301 /admin/;
    }
    location = /wizard {
      return 301 /admin/wizard;
    }

    location /kiosk/ {
      proxy_pass http://kiosk-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /kiosk {
      return 301 /kiosk/;
    }

    location /tv/ {
      proxy_pass http://tv-display-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /tv {
      return 301 /tv/;
    }

    location /caller/ {
      proxy_pass http://caller-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /caller {
      return 301 /caller/;
    }

    location /admin/ {
      proxy_pass http://admin-service:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /admin {
      return 301 /admin/;
    }
  }
}