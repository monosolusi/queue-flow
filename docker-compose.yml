# Enterprise Offline Queue Management System (QMS) — single-host deployment.
#
# Every service runs in its own container on one local PC server, fronted by
# the `gateway` reverse proxy. At a store, bring the whole stack up with:
#
#   ./install.sh
#
# which pulls the published images and starts them. In development, build from
# source instead with `docker compose up -d --build`.
#
# Then open http://antrian.local/ (or the server IP) — a clean browser is
# redirected to /admin/aktivasi, and after activation to /admin/wizard
# (FR-WZD-01). No internet is required at runtime (NFR-REL-01) beyond the single
# outbound call that redeems the activation key; every container self-heals
# (NFR-REL-03).
#
# ## image: alongside build:
#
# Each first-party service names both. `build` is what a developer uses and what
# scripts/release.mjs invokes to produce the tagged images; `image` is what a
# store pulls, so a mini PC never compiles five services and downloads a 63 MB
# voice model over a shop's connection. QMS_REGISTRY and QMS_VERSION come from
# the .env file beside this one — see .env.example.

services:
  # --- Database ------------------------------------------------------------
  # PostgreSQL 15 with WAL (default) — durable ticket/sequence state so a
  # power cut leaves the DB consistent with no dupes/gaps (NFR-REL-02).
  db-service:
    image: postgres:15-alpine
    restart: always # NFR-REL-03
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
      # WAL + fsync are on by default in the official image (durable commits).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms -d qms"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Internal only — not published to the LAN (NFR-SEC-01).

  # --- Backend ------------------------------------------------------------
  core-api-service:
    image: ${QMS_REGISTRY:-qms}/core-api:${QMS_VERSION:-latest}
    build:
      context: ./services/core-api
    restart: always # NFR-REL-03
    depends_on:
      db-service:
        condition: service_healthy
    environment:
      # PostgreSQL profile — boot migration runner + WAL-durable repos.
      QMS_PERSISTENCE: postgres
      QMS_DB_URL: postgresql://qms:qms@db-service:5432/qms
      NODE_ENV: production
    expose:
      - "3000"
    # Not published directly — the gateway proxies /api + /ws here.
    healthcheck:
      # /api/health answers pre-wizard (HealthController), so this is a true
      # liveness probe for the Nest bootstrap + migration runner, not just
      # the process. `wget` ships in node:20-alpine (no curl needed).
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # --- Text-to-speech -----------------------------------------------------
  # Indonesian announcement audio for the TV board (Piper TTS, Python/FastAPI).
  # The TV asks for one MP3 per called ticket and plays it; the grammar, the
  # voice and the bell all live here, so the model can be swapped without
  # touching the display service.
  #
  # The Piper voice is baked into the image during build, so nothing is fetched
  # at runtime (NFR-REL-01) and `docker compose up -d --build` remains the only
  # bring-up step (NFR-MNT-02).
  tts-service:
    image: ${QMS_REGISTRY:-qms}/tts:${QMS_VERSION:-latest}
    build:
      context: ./services/tts-service
    restart: always # NFR-REL-03
    environment:
      # Read `ttsConfiguration` from core-api. The dependency points this way on
      # purpose: no admin->tts push endpoint, so no new authenticated surface,
      # and core-api stays unaware this service exists.
      QMS_CORE_API_URL: http://core-api-service:3000
      QMS_TTS_LOG_LEVEL: info
    expose:
      - "8000"
    # Not published directly — the gateway proxies /tts here.
    volumes:
      # Synthesized clips survive restarts, so the first announcement of the
      # morning is not waiting on a cold synthesis (NFR-REL-02/03).
      - ttscache:/var/cache/qms-tts
      # Human word recordings backing `PrerecordedTtsEngine`, the second
      # `TtsEngine` impl. Bind-mounted rather than baked into the image: they are
      # store-supplied content, and without this mount the directory the engine
      # scans simply would not exist in the container -- it would report zero
      # voices and could never be selected, making the swappable-engine claim true
      # only of the test suite.
      - ./services/tts-service/recordings:/app/recordings:ro
    healthcheck:
      # /tts/health is liveness only — no model, no cache, answers pre-wizard.
      # python:*-slim ships neither wget nor curl (unlike node:20-alpine), so
      # the core-api `wget -qO-` idiom does not port here.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8000/tts/health').read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s # loading a 63 MB ONNX voice is slower than a Nest boot

  # --- Frontends (static PWAs served by per-service nginx) ---------------
  kiosk-service:
    image: ${QMS_REGISTRY:-qms}/kiosk:${QMS_VERSION:-latest}
    build:
      context: ./services/kiosk-service
    restart: always # NFR-REL-03
    expose:
      - "80"

  tv-display-service:
    image: ${QMS_REGISTRY:-qms}/tv-display:${QMS_VERSION:-latest}
    build:
      context: ./services/tv-display-service
    restart: always # NFR-REL-03
    expose:
      - "80"

  caller-service:
    image: ${QMS_REGISTRY:-qms}/caller:${QMS_VERSION:-latest}
    build:
      context: ./services/caller-service
    restart: always # NFR-REL-03
    expose:
      - "80"

  admin-service:
    image: ${QMS_REGISTRY:-qms}/admin:${QMS_VERSION:-latest}
    build:
      context: ./services/admin-service
    restart: always # NFR-REL-03
    expose:
      - "80"

  # --- Gateway -----------------------------------------------------------
  # The single LAN-facing entry point. Reverse-proxies /api + /ws to core-api
  # and each frontend sub-path to its PWA container. Serves nothing itself.
  gateway:
    image: nginx:alpine
    restart: always # NFR-REL-03
    depends_on:
      core-api-service:
        condition: service_healthy
      kiosk-service:
        condition: service_started
      tv-display-service:
        condition: service_started
      caller-service:
        condition: service_started
      admin-service:
        condition: service_started
      # service_started, NOT service_healthy: if the voice failed to load, a
      # never-green probe here would stop the gateway from ever starting and
      # `docker compose up -d` would hang — turning a mute TV into a dead stack
      # (NFR-MNT-02). The board degrades to silence instead, which is what the
      # four frontends' service_started already assumes for themselves.
      tts-service:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  ttscache: