# Production overlay — the host fingerprint mount for licence binding.
#
# `install.sh` links this as `docker-compose.override.yml`, which Compose
# auto-loads with no extra flags, so bring-up at the store stays exactly
# `docker compose up -d` (NFR-MNT-02).
#
# NOT part of the base docker-compose.yml on purpose: macOS has no /sys, so a
# developer running `docker compose up -d` — and the Docker-gated tier 2 of
# scripts/verify-topology.mjs — would fail on a missing bind-mount source. An
# absent mount degrades to "fingerprint unavailable", which never blocks, so
# leaving it out of dev costs nothing.
#
# Why product_uuid is the only claim, and why /etc/machine-id is deliberately
# not here any more: see the note in
# services/core-api/src/infrastructure/licensing/sysfs-host-fingerprint-reader.ts.

services:
  core-api-service:
    volumes:
      - /sys/class/dmi/id/product_uuid:/host/board-uuid:ro
